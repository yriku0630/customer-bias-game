<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お客様の本音を探れ！</title><style>body{font-family:-apple-system,sans-serif;background:#f5f5f5;color:#222;margin:0;padding:20px}main{max-width:560px;margin:auto}h1{font-size:25px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:16px;margin:10px 0}button{font:inherit;cursor:pointer}.q{display:block;width:100%;text-align:left;background:white;border:2px solid #ddd;border-radius:12px;padding:15px;margin:8px 0}.chosen{border-color:#222;background:#e9e9e9}.action{background:#171717;color:white;border:0;border-radius:12px;padding:16px;width:100%;margin-top:15px}.action:disabled{opacity:.35}.small{color:#666;font-size:13px}.hidden{display:none}</style><main><h1>お客様の本音を探れ！</h1><p class="small">確証バイアス体験ゲーム</p><div class="card"><b>お客様A</b><p>30代男性。黒いシンプルなダウンを着用して来店。</p><p>「新しいダウンを探しているんですが、何かおすすめありますか？」</p></div><div id="pick"><h3>質問を2つ選んでください</h3><p class="small">2つ選ぶまで回答は表示されません。</p><div id="qs"></div><button class="action" id="go" disabled onclick="show()">回答を見る</button></div><div id="answers" class="hidden"><h3>お客様の回答</h3><div id="result"></div><p>この情報から、どんなダウンを提案しますか？</p><button class="action" onclick="reveal()">本当の希望を公開</button></div><div id="truth" class="hidden"><div class="card"><h3>本当の希望</h3><p>「仕事ではシンプルな服装が多いので、休日は少し遊びのあるデザインを着たい。今回は普段と違うダウンに挑戦したい。」</p></div><h3>振り返り</h3><p>最初の印象に合う情報ばかり集めていませんでしたか？</p><p><b>仮説を立てる力と、仮説を疑う力は両方大切。</b></p><button class="action" onclick="location.reload()">もう一度遊ぶ</button></div></main><script>const q=['普段は黒い服を選ばれることが多いですか？','ロゴは控えめなデザインがお好みですか？','普段はどのような場面でダウンを着られますか？','今回、新しいダウンを探そうと思われたきっかけは？','これまでに気になったデザインはありますか？','今お持ちのダウンで気に入っている点は？'];const a=['仕事の日は黒が多いですね。','今着ているものは控えめですね。','仕事でも休日でも着ますが、今回は休日用です。','いつも同じような服なので、少し変えたいと思って。','実は、少し大胆なデザインも気になっています。','軽くて合わせやすいところですね。'];let selected=[];const qs=document.getElementById('qs');q.forEach((s,i)=>{let b=document.createElement('button');b.className='q';b.textContent=(i+1)+'. '+s;b.onclick=()=>{if(selected.includes(i))selected=selected.filter(x=>x!==i);else if(selected.length<2)selected.push(i);document.querySelectorAll('.q').forEach((x,j)=>x.classList.toggle('chosen',selected.includes(j)));document.getElementById('go').disabled=selected.length!==2};qs.appendChild(b)});function show(){document.getElementById('pick').classList.add('hidden');document.getElementById('answers').classList.remove('hidden');document.getElementById('result').innerHTML=selected.map(i=>'<div class="card"><b>'+q[i]+'</b><p>「'+a[i]+'」</p></div>').join('')}function reveal(){document.getElementById('answers').classList.add('hidden');document.getElementById('truth').classList.remove('hidden')}</script></html>
