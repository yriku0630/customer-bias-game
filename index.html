<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101318"><title>THE CLIENT | CASE 01</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;color:#f2f3f5;background:#101318;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:disabled{cursor:not-allowed;opacity:.4}.wrap{max-width:670px;margin:auto;padding:24px 20px 85px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#9ca4ae;font-size:11px;letter-spacing:.18em;border-bottom:1px solid #323841;padding-bottom:18px}.step{font-size:11px;letter-spacing:.17em;color:#a7b1be;margin:30px 0 10px}.title{font-size:clamp(35px,9vw,58px);letter-spacing:-.055em;line-height:1.02;margin:8px 0 15px;font-weight:800}.lead{font-size:14px;color:#bbc2ca;line-height:1.9}.panel{background:#1b2027;border:1px solid #353d48;border-radius:16px;padding:19px;margin:18px 0}.portrait{height:195px;background:linear-gradient(150deg,#373e48 0%,#161b23 55%,#090b0f 100%);position:relative;overflow:hidden;border-radius:12px;margin-bottom:17px}.portrait:before{content:'';position:absolute;width:115px;height:115px;border-radius:50%;background:#6b737b;left:calc(50% - 57px);top:23px;box-shadow:0 12px 0 5px #282c32}.portrait:after{content:'';position:absolute;width:270px;height:220px;background:linear-gradient(115deg,#080a0d,#2b3038 55%,#080a0d);border-radius:47% 47% 0 0;left:calc(50% - 135px);top:112px;border:2px solid #454b53}.portrait span{position:absolute;z-index:2;bottom:12px;right:12px;color:#c9d0d8;font-size:10px;letter-spacing:.12em}.eyebrow{color:#aab3be;font-size:11px;letter-spacing:.13em;text-transform:uppercase}.person{font-size:20px;font-weight:700;margin:8px 0}.detail{color:#b9c0c8;font-size:13px;line-height:1.9}.quote{border-left:2px solid #d8e2ee;padding:12px 15px;background:#262d36;margin-top:14px;line-height:1.85;font-size:15px}.section{font-size:22px;letter-spacing:-.03em;margin:13px 0}.hint{font-size:13px;color:#aeb7c3;line-height:1.8}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.choice,.question{background:#1a1f26;border:1px solid #38414b;border-radius:12px;color:#eef1f4;text-align:left;padding:15px;min-height:112px;transition:.15s}.choice strong{display:block;font-size:13px;line-height:1.5}.choice small{display:block;color:#a7b0bb;font-size:11px;line-height:1.6;margin-top:8px}.choice.selected,.question.selected{border-color:#e3ebf5;background:#293341;box-shadow:inset 0 0 0 1px #e3ebf5}.question{display:flex;align-items:flex-start;gap:11px;min-height:74px;width:100%;font-size:13px;line-height:1.65}.question .n{color:#8897aa;font-size:11px;min-width:23px}.qgrid{display:grid;gap:9px;margin:18px 0}.action{width:100%;background:#e7edf5;border:0;color:#11151b;padding:17px;border-radius:12px;font-weight:750;margin:14px 0 0}.secondary{background:transparent;border:1px solid #596372;color:#e7edf5}.counter{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#aeb8c4;margin:18px 0 8px}.answer{background:#232b34;border:1px solid #46515e;border-radius:12px;padding:15px;margin:10px 0}.answer .ask{color:#a9b7c6;font-size:12px;line-height:1.6}.answer .reply{font-size:15px;line-height:1.8;margin-top:9px}.tag{display:inline-block;font-size:11px;padding:5px 9px;border:1px solid #596676;border-radius:100px;color:#cdd6e0}.timeline{display:grid;gap:9px;margin:18px 0}.timeitem{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px;background:#1b2027;border-radius:10px;font-size:13px}.timeitem span{color:#aeb7c3}.timeitem strong{text-align:right}.report{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.metric{padding:18px;background:#1b2027;border:1px solid #353d48;border-radius:12px}.metric b{display:block;font-size:34px;margin-top:7px}.metric span{font-size:11px;color:#b6c0cc}.reveal{border:1px solid #c7d2e0;border-radius:15px;padding:21px;margin:20px 0;background:#202833}.reveal h2{font-size:25px;margin:8px 0}.reveal p{line-height:1.95;font-size:14px}.foot{font-size:11px;color:#8693a3;line-height:1.8;margin-top:24px}.hidden{display:none!important}@media(max-width:360px){.wrap{padding-left:14px;padding-right:14px}.choices{gap:7px}.choice{padding:12px}.choice strong{font-size:12px}}
</style></head><body><main class="wrap"><header class="top"><span>CLIENT EXPERIENCE / TRAINING</span><span id="progress">CASE 01</span></header><div id="app"></div></main><script>
'use strict';
const products=[{id:'A',name:'CLASSIC',desc:'黒・定番・シンプルなショートダウン'},{id:'B',name:'MINIMAL TECH',desc:'黒・機能性・控えめなデザイン'},{id:'C',name:'STATEMENT',desc:'黒・大胆なシルエットと存在感'},{id:'D',name:'EXPERIMENTAL',desc:'カラーやディテールに遊びのある一着'}];
const questions=[
{id:1,t:'普段はどのような色の服を着られますか？',kind:'confirm',a:'黒やネイビーが多いですね。仕事の日は特に。'},
{id:2,t:'ロゴは控えめなデザインがお好きですか？',kind:'confirm',a:'今持っているダウンは控えめですね。合わせやすいので。'},
{id:3,t:'今お持ちのダウンで気に入っているところは？',kind:'neutral',a:'軽くて、何にでも合わせやすいところですね。'},
{id:4,t:'今回のダウンは、どんな場面で着る予定ですか？',kind:'explore',a:'今回は休日用ですね。仕事の日に着るものはもう持っているので。'},
{id:5,t:'新しいダウンが欲しくなったきっかけは何ですか？',kind:'explore',a:'最近、服装がいつも同じ感じになってしまって。少し変えたいんですよね。'},
{id:6,t:'今までと違うデザインも気になりますか？',kind:'explore',a:'そうですね。実は、少し大胆なものも気になっています。'},
{id:7,t:'休日はどんなスタイリングが多いですか？',kind:'explore',a:'最近はワイドパンツやスニーカーが多くて、少しストリート寄りです。'},
{id:8,t:'ご予算はどのくらいを考えていますか？',kind:'neutral',a:'30万円前後で考えています。気に入れば少し超えても大丈夫です。'},
{id:9,t:'丈感はどのくらいがお好みですか？',kind:'neutral',a:'ショート丈がいいですね。車にも乗るので。'},
{id:10,t:'着心地で特に重視されることはありますか？',kind:'neutral',a:'軽さと動きやすさですね。重すぎない方がいいです。'},
{id:11,t:'今回、絶対に外せない条件は何ですか？',kind:'explore',a:'長く着たいですね。でも、無難なものという意味ではないです。'},
{id:12,t:'店内で気になった商品はありましたか？',kind:'explore',a:'奥にあった、ちょっと変わったシルエットのものが目に入りました。'}
];
let state={phase:'intro',initial:null,mid:null,final:null,r1:[],r2:null,reason:'',answerView:false};
const app=document.getElementById('app'), progress=document.getElementById('progress');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function product(id){return products.find(x=>x.id===id)}
function getQuestion(id){return questions.find(x=>x.id===id)}
function response(q,round){if(round===2){if(q.id===2&&state.r1.some(id=>[5,6,12].includes(id)))return '普段は控えめですけど、今回は少し違うものを見てみたいです。';if(q.id===1&&state.r1.includes(4))return '仕事では黒が多いです。ただ今回は休日用なので、色にはそこまでこだわっていません。';if(q.id===6&&state.r1.includes(5))return 'はい。いつもと違う雰囲気にしたいので、少し大胆なシルエットも見てみたいです。';if(q.id===12&&state.r1.includes(7))return '奥の少しボリュームがあるモデルですね。休日の服装に合いそうだなと。';if(q.id===4&&state.r1.includes(1))return '今回は休日用です。仕事では黒のダウンをよく着るんですが。'}return q.a}
function btn(label,fn,disabled=false,cls=''){return `<button class="action ${cls}" ${disabled?'disabled':''} data-act="${fn}">${label}</button>`}
function productsHtml(key){return `<div class="choices">${products.map(p=>`<button class="choice ${state[key]===p.id?'selected':''}" data-product="${key}:${p.id}" aria-pressed="${state[key]===p.id}"><span class="eyebrow">OPTION ${p.id}</span><strong>${esc(p.name)}</strong><small>${esc(p.desc)}</small></button>`).join('')}</div>`}
function answersHtml(ids,round){return ids.map(id=>{let q=getQuestion(id);return `<div class="answer"><div class="ask">Q. ${esc(q.t)}</div><div class="reply">「${esc(response(q,round))}」</div></div>`}).join('')}
function render(){let h='';const phases=['intro','first','round1','answers1','middle','round2','answers2','last','result'];progress.textContent=`${Math.max(1,phases.indexOf(state.phase)+1)} / ${phases.length}`;
if(state.phase==='intro')h=`<div class="step">CASE 01 / FIRST CONTACT</div><h1 class="title">THE<br>CLIENT.</h1><p class="lead">あなたはブティックの販売スタッフ。限られたヒアリングの中で、お客様に最適だと思う一着を提案してください。</p><div class="panel"><div class="portrait"><span>ILLUSTRATIVE PROFILE</span></div><div class="eyebrow">CUSTOMER A / SAT 15:30</div><div class="person">35歳・男性 / IT企業勤務</div><div class="detail">黒のシンプルなダウン、黒のスラックス、白いスニーカー。腕には控えめな高級時計。落ち着いた話し方で、店内では黒の定番ダウンを手に取り、生地を確かめている。</div><div class="quote">「そろそろ新しいダウンが欲しいなと思って。何かおすすめありますか？」<br><br>「こういうの、使いやすいですよね」</div></div>${btn('接客を始める','start')}`;
if(state.phase==='first')h=`<div class="step">STEP 01 / FIRST IMPRESSION</div><h1 class="section">第一印象で選ぶなら？</h1><p class="hint">まだ質問はできません。見た目と最初の会話だけで、最初に紹介する商品を1つ選んでください。</p>${productsHtml('initial')}${btn('この商品で接客を進める','firstNext',!state.initial)}`;
if(state.phase==='round1')h=`<div class="step">STEP 02 / HEARING — ROUND 1</div><h1 class="section">何を聞きますか？</h1><p class="hint">12個の質問から、聞きたい質問を<strong>2つ</strong>選んでください。回答は2つ選び終わってからまとめて表示されます。</p><div class="counter"><span>質問の選択</span><strong>${state.r1.length} / 2</strong></div><div class="qgrid">${questions.map(q=>`<button class="question ${state.r1.includes(q.id)?'selected':''}" data-q1="${q.id}" aria-pressed="${state.r1.includes(q.id)}"><span class="n">${String(q.id).padStart(2,'0')}</span><span>${esc(q.t)}</span></button>`).join('')}</div>${btn('お客様の回答を見る','show1',state.r1.length!==2)}`;
if(state.phase==='answers1')h=`<div class="step">STEP 03 / CUSTOMER RESPONSE</div><h1 class="section">お客様の回答</h1><p class="hint">選んだ2つの質問への回答です。何が分かり、何がまだ分からないでしょうか。</p>${answersHtml(state.r1,1)}${btn('提案を見直す','toMiddle')}`;
if(state.phase==='middle')h=`<div class="step">STEP 04 / REASSESSMENT</div><h1 class="section">現時点では何を提案する？</h1><p class="hint">最初と同じ商品でも構いません。今得られている情報から、改めて1つ選んでください。</p><div class="panel"><div class="eyebrow">YOUR FIRST CHOICE</div><div class="person">${esc(product(state.initial).name)}</div></div>${productsHtml('mid')}${btn('最後の質問へ','middleNext',!state.mid)}`;
if(state.phase==='round2')h=`<div class="step">STEP 05 / HEARING — ROUND 2</div><h1 class="section">あと1問だけ聞けます。</h1><p class="hint">これまでに聞いていない質問から、最後の1問を選んでください。前の会話の流れによって、お客様の答え方が少し変わる場合があります。</p><div class="counter"><span>残りの質問</span><strong>1問</strong></div><div class="qgrid">${questions.filter(q=>!state.r1.includes(q.id)).map(q=>`<button class="question ${state.r2===q.id?'selected':''}" data-q2="${q.id}" aria-pressed="${state.r2===q.id}"><span class="n">${String(q.id).padStart(2,'0')}</span><span>${esc(q.t)}</span></button>`).join('')}</div>${btn('最後の回答を見る','show2',!state.r2)}`;
if(state.phase==='answers2')h=`<div class="step">STEP 06 / FINAL RESPONSE</div><h1 class="section">最後の回答</h1>${answersHtml([state.r2],2)}${btn('最終提案を決める','toLast')}`;
if(state.phase==='last')h=`<div class="step">STEP 07 / YOUR PROPOSAL</div><h1 class="section">最終的に、何を提案しますか？</h1><p class="hint">お客様から聞けたことを踏まえて、最もふさわしいと思う商品を選んでください。</p>${productsHtml('final')}<div class="panel"><label for="reason" class="eyebrow">提案理由（任意）</label><textarea id="reason" maxlength="180" placeholder="なぜその商品を選びましたか？" style="width:100%;margin-top:12px;min-height:85px;resize:vertical;background:#12171d;color:#fff;border:1px solid #4d5867;border-radius:9px;padding:12px;font:inherit;font-size:14px">${esc(state.reason)}</textarea></div>${btn('接客結果を見る','finish',!state.final)}`;
if(state.phase==='result'){const selected=[...state.r1,state.r2].map(getQuestion),confirm=selected.filter(q=>q.kind==='confirm').length,explore=selected.filter(q=>q.kind==='explore').length,neutral=selected.filter(q=>q.kind==='neutral').length,changed=state.initial!==state.final;h=`<div class="step">CASE 01 / DECISION REPORT</div><h1 class="title">YOUR<br>DECISION.</h1><p class="lead">あなたが選んだ質問と提案を振り返ってみましょう。</p><div class="timeline"><div class="timeitem"><span>第一印象</span><strong>${esc(product(state.initial).name)}</strong></div><div class="timeitem"><span>2問のヒアリング後</span><strong>${esc(product(state.mid).name)}</strong></div><div class="timeitem"><span>最終提案</span><strong>${esc(product(state.final).name)}</strong></div></div><div class="report"><div class="metric"><span>仮説を確かめやすい質問</span><b>${confirm}</b></div><div class="metric"><span>新しい可能性を探る質問</span><b>${explore}</b></div></div><p class="hint">その他の条件確認：${neutral}問。質問の分類は振り返り用の目安で、個々の質問の良し悪しを断定するものではありません。</p><div class="reveal"><span class="eyebrow">THE REVEAL</span><h2>CONFIRMATION BIAS</h2><p><strong>確証バイアス</strong> — 最初に抱いた仮説に合う情報を重視し、別の可能性を見落としやすくなる傾向。</p><p><strong>お客様の本当の希望：</strong>「仕事ではシンプルな黒の服ばかりなので、休日は少し遊びのあるダウンに挑戦したかった。黒でも構わないけれど、いつもと違うシルエットやディテールが欲しい」</p><p>このケースでは<strong>C（STATEMENT）</strong>が有力な提案候補。ただしCが唯一の正解ではありません。大切なのは、お客様の用途や変化への希望を確認できたかどうかです。</p></div><div class="panel"><div class="eyebrow">YOUR HEARING LOG</div>${selected.map((q,i)=>`<div style="margin-top:15px;border-top:1px solid #3c4653;padding-top:12px"><span class="tag">${q.kind==='confirm'?'仮説確認':q.kind==='explore'?'可能性の探索':'条件確認'}</span><p style="font-size:13px;line-height:1.8">Q${i+1}. ${esc(q.t)}</p></div>`).join('')}</div><div class="panel"><strong>振り返りの問い</strong><p class="hint">「お客様の話を聞いて判断を変えたか？ それとも、最初の判断を確かめる質問を選んだか？」</p><p class="hint">あなたの最終提案は、最初から<strong>${changed?'変化しました':'変わりませんでした'}</strong>。変化したことも、変わらなかったことも、それ自体が正解・不正解ではありません。</p>${state.reason?`<div class="quote">あなたの提案理由：${esc(state.reason)}</div>`:''}</div>${btn('結果をコピーする','copy')}${btn('もう一度プレイする','restart',false,'secondary')}<p class="foot">研修用の架空ケースです。質問の分類と回答の変化は学習用に設計されたもので、心理傾向を診断するものではありません。</p>`}
app.innerHTML=h;window.scrollTo({top:0,behavior:'instant'});}
app.addEventListener('click',e=>{let el=e.target.closest('[data-product],[data-q1],[data-q2],[data-act]');if(!el)return;if(el.dataset.product){const [key,id]=el.dataset.product.split(':');state[key]=id;render();return}if(el.dataset.q1){const id=Number(el.dataset.q1);if(state.r1.includes(id))state.r1=state.r1.filter(x=>x!==id);else if(state.r1.length<2)state.r1.push(id);render();return}if(el.dataset.q2){state.r2=Number(el.dataset.q2);render();return}const a=el.dataset.act;if(a==='start')state.phase='first';if(a==='firstNext'&&state.initial)state.phase='round1';if(a==='show1'&&state.r1.length===2)state.phase='answers1';if(a==='toMiddle')state.phase='middle';if(a==='middleNext'&&state.mid)state.phase='round2';if(a==='show2'&&state.r2)state.phase='answers2';if(a==='toLast')state.phase='last';if(a==='finish'&&state.final){state.reason=document.getElementById('reason')?.value||'';state.phase='result'}if(a==='restart')state={phase:'intro',initial:null,mid:null,final:null,r1:[],r2:null,reason:''};if(a==='copy'){const selected=[...state.r1,state.r2].map(getQuestion);const msg=`THE CLIENT / CASE 01\n第一印象: ${product(state.initial).name}\n中間判断: ${product(state.mid).name}\n最終提案: ${product(state.final).name}\n質問: ${selected.map(q=>q.id).join(', ')}\n提案理由: ${state.reason||'未入力'}`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(msg).then(()=>alert('結果をコピーしました')).catch(()=>prompt('以下をコピーしてください',msg));else prompt('以下をコピーしてください',msg);return}render()});
render();
</script></body></html>
